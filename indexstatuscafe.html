<head>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
</head>

<body>

  <!-- Status.cafe Feed Container -->
  <a href="https://status.cafe/users/heejinsoulyves"><h1>status.cafe/users/heejinsoulyves</h1></a>
  <div id="statuscafe-feed"></div>

  <script>
    const feedURL = "https://status.cafe/users/heejinsoulyves.atom";

    fetch(feedURL)
      .then(response => response.text())
      .then(str => new window.DOMParser().parseFromString(str, "text/xml"))
      .then(data => {
        const entries = data.querySelectorAll("entry");
        let html = "";

        entries.forEach(el => {
          const content = el.querySelector("content").textContent.trim();
          const date = el.querySelector("published").textContent.slice(0, 10);

          html += `
            <div class="status-post">
              <p><strong>${date}</strong></p>
              <p>${content}</p>
            </div>
            <hr/>
          `;
        });

        document.getElementById("statuscafe-feed").innerHTML = html;
      });
  </script>
  
</body>
